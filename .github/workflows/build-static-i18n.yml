name: Build static language pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'projects.html'
      - 'consultancy.html'
      - 'about.html'
      - 'contact.html'
      - 'privacy.html'
      - 'status.html'
      - 'assets/site.js'
      - 'assets/ui-v2.css'
      - 'assets/ui-v2.js'
      - 'build_i18n.py'
      - 'build_seo.py'
      - 'build_ui.py'
      - 'build_sitemap.py'
      - '.update/**'
      - '.github/workflows/build-static-i18n.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply staged v3 source update
        if: hashFiles('.update/v3.part01') != ''
        run: |
          cat .update/v3.part* > /tmp/kianirad-v3.b64
          base64 -d /tmp/kianirad-v3.b64 > /tmp/kianirad-v3.tar.gz
          gzip -t /tmp/kianirad-v3.tar.gz
          tar -tzf /tmp/kianirad-v3.tar.gz
          tar -xzf /tmp/kianirad-v3.tar.gz -C .
          rm -rf .update
      - name: Generate translated pages, SEO, UI and sitemap
        run: |
          python3 build_i18n.py
          python3 build_seo.py
          python3 build_ui.py
          python3 build_sitemap.py
          git diff --check
      - name: Commit generated files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Generated pages already up to date.'
          else
            git commit -m 'Apply validated website v3 update'
            git push
          fi
